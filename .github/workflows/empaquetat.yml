name: Empaquetar comprova_desplegaments

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Saludar
        run: echo "Hola des de GitHub Actions"
      
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Instal·lar PyInstaller
        run: pyinstaller --onefile comprova_desplegaments.py
      
      - name: Llistar el contingut de dist
        run: ls -la dist