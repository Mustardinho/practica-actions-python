name: Node.js CI

on:
  push:
    branches: [nodejs_linter_job]
  
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Instal·lar dependències
        run: npm install
      
      - name: Executar el linter
        run: npm run lint